name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m scripts.export_openapi --check
      - run: uv run --locked pytest
      - uses: docker/setup-buildx-action@v3
      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          load: true
          tags: holos-gateway:development
          cache-from: type=gha,scope=gateway-development
          cache-to: type=gha,mode=max,scope=gateway-development
      - name: Verify development tools and tests inside the image
        run: |
          docker run --rm --env OTEL_SDK_DISABLED=true holos-gateway:development sh -ec '
            uv run --locked ruff check .
            uv run --locked ruff format --check .
            uv run --locked python -m scripts.export_openapi --check
            uv run --locked pytest
          '
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: holos-gateway:production
          cache-from: type=gha,scope=gateway-production
          cache-to: type=gha,mode=max,scope=gateway-production
      - name: Verify production HTTP, health, runtime user, and shutdown
        run: uv run --locked python -m scripts.smoke_container holos-gateway:production

  publish:
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select registry image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags and source labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Publish tested production source
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=gateway-production
          cache-to: type=gha,mode=max,scope=gateway-production
