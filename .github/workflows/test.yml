name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m scripts.export_openapi --check
      - run: uv run --locked pytest

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: Install pinned promtool
        run: |
          promtool_dir="${RUNNER_TEMP}/holos-promtool"
          mkdir -p "$promtool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            --output "$promtool_dir/prometheus.tar.gz"
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  $promtool_dir/prometheus.tar.gz" | sha256sum --check
          tar -xzf "$promtool_dir/prometheus.tar.gz" -C "$promtool_dir" \
            --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          echo "$promtool_dir" >> "$GITHUB_PATH"
      - run: promtool check rules monitoring/recording-rules.yml monitoring/alerts.yml
      - run: promtool test rules monitoring/rules.test.yml
      - run: uv run --locked python -m scripts.check_dashboard
