[project]
name = "holos-gateway"
version = "0.1.0"
description = "A minimal FastAPI gateway service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135,<1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "uvicorn>=0.41,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9,<10",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "FAST", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
