[project]
name = "holos-gateway"
version = "0.1.0"
description = "A minimal FastAPI gateway service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn>=0.41,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
