services:
  gateway:
    build:
      context: .
      target: development
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      otlp_endpoint: ${otlp_endpoint:-}
      otlp_key: ${otlp_key:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-holos-api-gateway}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 30s
